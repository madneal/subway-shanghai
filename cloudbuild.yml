substitutions:
  _LOCATION: asia-southeast1
  _REPOSITORY: security-gate
  _SERVICE: subway-shanghai

steps:
  - id: sast
    name: ${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/go-sast:latest
    args:
      - --path
      - /workspace
      - --fail-on-findings

  - id: test
    name: node:20-bookworm-slim
    waitFor:
      - sast
    entrypoint: bash
    args:
      - -ceu
      - |
        npm ci
        npm test -- --run
        npm run build

  - id: build
    name: gcr.io/cloud-builders/docker
    waitFor:
      - test
    args:
      - build
      - -t
      - ${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/subway-shanghai:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    waitFor:
      - build
    args:
      - push
      - ${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/subway-shanghai:latest

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor:
      - push
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/subway-shanghai:latest
      - --region=${_LOCATION}
      - --platform=managed
      - --port=8080
      - --allow-unauthenticated
      - --quiet

images:
  - ${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/subway-shanghai:latest

options:
  logging: CLOUD_LOGGING_ONLY
